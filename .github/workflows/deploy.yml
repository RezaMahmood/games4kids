name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      any: ${{ steps.plan.outputs.any }}
      infraShared: ${{ steps.plan.outputs.infraShared }}
      infraGames: ${{ steps.plan.outputs.infraGames }}
      apps: ${{ steps.plan.outputs.apps }}
      sites: ${{ steps.plan.outputs.sites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: plan
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          all=()
          if [ "$MANUAL" = "true" ]; then all=(--all); fi
          node tools/changes.mjs "${all[@]}" --base "$BEFORE" --head "$HEAD_SHA" --github-output

  build:
    needs: changes
    if: ${{ needs.changes.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run gen
      - run: npx tsc -b
      - run: npm run build:web
      - name: Bundle what the deploy jobs need
        env:
          APPS: ${{ needs.changes.outputs.apps }}
          SITES: ${{ needs.changes.outputs.sites }}
          INFRA_GAMES: ${{ needs.changes.outputs.infraGames }}
        run: |
          set -euo pipefail
          mkdir -p out/apps out/sites out/games
          for app in $(echo "$APPS" | jq -r '.[]'); do node tools/package-app.mjs "$app" --out out/apps; done
          for site in $(echo "$SITES" | jq -r '.[]'); do node tools/site-config.mjs "$site" --out "out/sites/$site"; done
          cp -R infra out/infra
          for game in $(echo "$INFRA_GAMES" | jq -r '.[]'); do
            mkdir -p "out/games/$game/.gen"
            cp games/"$game"/.gen/params.json "out/games/$game/.gen/"
            find "games/$game" -maxdepth 1 -name '*.bicep' -exec cp {} "out/games/$game/" \;
          done
          mkdir -p out/tools/swa-cli
          cp tools/*.mjs tools/*.ts out/tools/
          cp tools/swa-cli/package.json tools/swa-cli/package-lock.json out/tools/swa-cli/
          find out -type f | sort
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle
          path: out
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  infra:
    needs: [changes, build]
    if: ${{ needs.build.result == 'success' && (needs.changes.outputs.infraShared == 'true' || needs.changes.outputs.infraGames != '[]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: infra
    permissions:
      contents: read
      id-token: write
    env:
      GAMES_CLIENT_ID: ${{ vars.GAMES_CLIENT_ID }}
      ADMIN_CLIENT_ID: ${{ vars.ADMIN_CLIENT_ID }}
      GAMES_PRINCIPAL_ID: ${{ vars.GAMES_PRINCIPAL_ID }}
      ADMIN_PRINCIPAL_ID: ${{ vars.ADMIN_PRINCIPAL_ID }}
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: bundle
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Shared infrastructure
        if: ${{ needs.changes.outputs.infraShared == 'true' }}
        working-directory: bundle
        run: node tools/deploy.mjs infra shared
      - name: Game infrastructure
        if: ${{ needs.changes.outputs.infraGames != '[]' }}
        working-directory: bundle
        env:
          INFRA_GAMES: ${{ needs.changes.outputs.infraGames }}
        run: |
          set -euo pipefail
          for game in $(echo "$INFRA_GAMES" | jq -r '.[]'); do node tools/deploy.mjs infra game "$game"; done

  apps:
    needs: [changes, build, infra]
    if: ${{ !failure() && !cancelled() && needs.build.result == 'success' && needs.changes.outputs.apps != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: deploy
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: bundle
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy the app and check its health
        working-directory: bundle
        env:
          APP: ${{ matrix.app }}
        run: node tools/deploy.mjs app "$APP" "apps/func-g4k-$APP.zip"

  sites:
    needs: [changes, build, apps]
    if: ${{ !failure() && !cancelled() && needs.build.result == 'success' && needs.changes.outputs.sites != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: deploy
    permissions:
      contents: read
      id-token: write
    env:
      GAMES_CLIENT_ID: ${{ vars.GAMES_CLIENT_ID }}
      ADMIN_CLIENT_ID: ${{ vars.ADMIN_CLIENT_ID }}
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.changes.outputs.sites) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: bundle
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the Static Web Apps CLI from its lockfile
        working-directory: bundle
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix tools/swa-cli
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy the site and check its config
        working-directory: bundle
        env:
          SITE: ${{ matrix.site }}
        run: node tools/deploy.mjs site "$SITE" "sites/$SITE" tools/swa-cli/node_modules/@azure/static-web-apps-cli/dist/cli/bin.js
