name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run gen
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      - name: Bicep builds and lints clean
        run: |
          set -euo pipefail
          for file in infra/main.bicep infra/game.bicep test/fixtures/games/fixture/infra.bicep; do
            az bicep build --file "$file" --outfile /dev/null
            findings=$(az bicep lint --file "$file" 2>&1)
            if [ -n "$findings" ]; then echo "$findings"; exit 1; fi
          done
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
