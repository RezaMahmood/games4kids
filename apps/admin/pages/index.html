<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Members</title>
	<link rel="stylesheet" href="/shared/tokens.css">
	<link rel="stylesheet" href="/shared/shell.css">
	<link rel="stylesheet" href="/style.css">
</head>
<body aria-busy="true">
	<admin-bar></admin-bar>
	<main class="page" inert>
		<h1>Members</h1>
		<div class="toolbar">
			<div class="toolbar-row">
				<input id="search" type="search" aria-label="Search people" placeholder="Search email or name" autocomplete="off" spellcheck="false">
				<button id="add-person" class="g4k-button" type="button">Add person</button>
			</div>
			<fieldset class="filters">
				<legend class="visually-hidden">Show</legend>
				<div id="filters" class="chips"></div>
			</fieldset>
			<p id="status" role="status" aria-live="polite">Loading members.</p>
			<div id="attention" aria-live="polite"></div>
		</div>
		<div id="alarms" role="alert"></div>
		<ul id="people" class="people" aria-label="People"></ul>
	</main>

	<dialog id="person" class="sheet" aria-labelledby="person-title">
		<header class="sheet-head">
			<h2 id="person-title" tabindex="-1"></h2>
			<button class="g4k-button quiet close" type="button" data-close>Close</button>
		</header>
		<p id="person-status" class="feedback" role="status" aria-live="polite"></p>
		<div id="person-body" class="sheet-body"></div>
	</dialog>

	<dialog id="add" class="sheet" aria-labelledby="add-title">
		<header class="sheet-head">
			<h2 id="add-title" tabindex="-1">Add a person</h2>
			<button class="g4k-button quiet close" type="button" data-close>Close</button>
		</header>
		<p id="add-status" class="feedback" role="status" aria-live="polite"></p>
		<div id="add-body" class="sheet-body"></div>
	</dialog>

	<dialog id="report" class="sheet" aria-labelledby="report-title">
		<header class="sheet-head">
			<h2 id="report-title" tabindex="-1">Entra report</h2>
			<button class="g4k-button quiet close" type="button" data-close>Close</button>
		</header>
		<p id="report-status" class="feedback" role="status" aria-live="polite"></p>
		<div class="sheet-body">
			<p>Changes in Entra ask you to sign in again, in a window, every time.</p>
			<ul id="drift" class="drift" aria-label="What Entra reported"></ul>
			<p id="report-actions" class="sheet-actions">
				<button id="sync-all" class="g4k-button" type="button" data-sync>Sync everyone</button>
				<button id="check-again" class="g4k-button quiet" type="button">Check again</button>
			</p>
		</div>
	</dialog>
	<script type="module" src="/members.js"></script>
</body>
</html>
